<!DOCTYPE html>
<h1>hello</h1>

<meta chartset = "UTF-8">
<meta name = "viewport" content = "width=device-width, initial-scale=1.0">
<script src= "https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
  .chart-container{
    width:90%;
    max-width:800px;
    margin:30px auto;
  }
</style>
</head>
<body>
  <div>
    <div class = "chart-container">
      <canvas id = chart></canvas>
  </div>
<script>
  const ctx=document.getElementById("chart");
  new Chart(ctx,{
    type:"line",
    data: {
      labels:["Monday","Tuesday","Wednesday","Thursday","Friday"],
      datasets:[{
        label:"Coffee Spending",
        data:[12.00,13.00,10.00,16.00,18.00],
        borderColor: "#FF0145",
        backgroundColor: "#E3DCDC",
        borderWidth:3,
        fill: True,
        tension: 0.35,
        pointRadius:4,
        pointBackgroundColor:"#FF0145"
      }]
    },
    options:{
      responsive:true,
      maintainAspectRatio:true,
      plugins:{
        display:true
      }
    },
    scales: {
      y:{
        beginAtZero:true
      }
    }
  }
            });
  
      
</script>
</body>
</html>
